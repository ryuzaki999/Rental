services:
  - type: web
    name: sportrental
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: change-this-to-a-random-secret
